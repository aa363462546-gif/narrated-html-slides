class SlidePresentation{constructor(){this.slides=[...document.querySelectorAll('.slide')];this.i=0;this.stage=document.getElementById('deckStage');this.count=document.getElementById('count');this.bar=document.getElementById('bar');this.scale=()=>{const f=Math.min(innerWidth/1920,innerHeight/1080);this.stage.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`};this.scale();addEventListener('resize',this.scale);addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();this.go(this.i+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();this.go(this.i-1)}});let y=0;addEventListener('touchstart',e=>y=e.changedTouches[0].clientY,{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].clientY-y;if(Math.abs(d)>45)this.go(this.i+(d<0?1:-1))},{passive:true});let lock=false;addEventListener('wheel',e=>{if(lock)return;lock=true;this.go(this.i+(e.deltaY>0?1:-1));setTimeout(()=>lock=false,650)},{passive:true});document.getElementById('prev').onclick=()=>this.go(this.i-1);document.getElementById('next').onclick=()=>this.go(this.i+1);this.go(0)}go(n){this.i=Math.max(0,Math.min(n,this.slides.length-1));this.slides.forEach((s,k)=>s.classList.toggle('active',k===this.i));this.slides.forEach(s=>s.classList.remove('visible'));requestAnimationFrame(()=>this.slides[this.i].classList.add('visible'));this.count.textContent=String(this.i+1).padStart(2,'0')+' / '+String(this.slides.length).padStart(2,'0');this.bar.style.width=((this.i+1)/this.slides.length*100)+'%'}}new SlidePresentation();
