<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>最小示例</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0e1711}
    .deck-stage{position:absolute;width:1920px;height:1080px;transform-origin:0 0;background:#0e1711;color:#f2eddc;font-family:sans-serif}
    .slide{position:absolute;inset:0;width:1920px;height:1080px;visibility:hidden;opacity:0;padding:150px}
    .slide:first-child{visibility:visible;opacity:1}.title{font-size:118px;line-height:1.1}.sub{font-size:52px;line-height:1.5;margin-top:48px}
  </style>
</head>
<body><main class="deck-stage">
  <section id="scene-01" class="slide" data-template-type="cover" aria-label="先看事实，再看结论。"><h1 class="title reveal">先看事实</h1><p class="sub reveal">再看结论</p></section>
  <section id="scene-02" class="slide" data-template-type="core-idea" aria-label="事实回答发生了什么，结论回答我们应该怎么做。"><h2 class="title reveal">事实与结论</h2><p class="sub reveal">发生了什么 / 应该怎么做</p></section>
</main><nav aria-label="幻灯片翻页"><button id="prev" type="button">上一页</button><button id="next" type="button">下一页</button></nav><script>const slides=[...document.querySelectorAll('.slide')];let index=0;document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);function show(next){index=Math.max(0,Math.min(next,slides.length-1));slides.forEach((slide,i)=>slide.classList.toggle('active',i===index));}</script></body></html>
